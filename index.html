            --text-primary: #FFF5E6;                        
            --text-muted: #A6968F;                          
            --card-hover-bg: rgba(54, 25, 25, 0.8);
            --spring-transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);

        [data-theme="light"] {
            --base-bg: #FFF5E6;                             
            --interface-glass: rgba(255, 254, 250, 0.96);    
            --border-glass: rgba(166, 43, 43, 0.14);        
            --accent: #B21E1E;                              
            --accent-glow: rgba(178, 30, 30, 0.1);
            --purple: #C27800;                              
            --purple-glow: rgba(194, 120, 0, 0.15);
            --text-primary: #1F0A0A;                        
            --text-muted: #594740;                          
            --card-hover-bg: rgba(253, 246, 232, 0.98);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

        .ambient-glow-wrapper {

            inset: 0;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .fluid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.18;
            mix-blend-mode: screen;
            will-change: transform;
            animation: floatingOrbs 12s ease-in-out infinite alternate;
        }

        [data-theme="light"] .fluid-orb {
            opacity: 0.06;
            mix-blend-mode: multiply;
        }

        .orb-primary {
            width: 45vw;
            height: 45vw;
            background: var(--purple);
            top: -10%;
            left: -10%;
        }

        .orb-secondary {
            width: 40vw;
            height: 40vw;
            background: var(--accent);
            bottom: -5%;
            right: -5%;
            animation-delay: -4s;
        }

        @keyframes floatingOrbs {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(40px) scale(1.1); }
        }

        /* Scroll Tracker Line */
        #scroll-progress-line {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            width: 0%;
            z-index: 10000;
            will-change: width;
            transition: width 0.1s linear;
        }

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
            background: var(--interface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            transition: background-color 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.25rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.45rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
            transition: var(--spring-transition);
        }

        .brand-logo span {
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .theme-toggle-btn {
            background: var(--border-glass);
            border: 1px solid var(--border-glass);
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--spring-transition);
        }

        .theme-toggle-btn:hover {
            background: var(--text-primary);
            color: var(--base-bg);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

            max-width: 900px;
            margin: 0 auto;
            padding: 9rem 2rem 6rem;

        .hero-showcase {
            text-align: center;
            margin-bottom: 4rem;
        }

        .status-pill {

            align-items: center;
            gap: 0.6rem;
            background: var(--purple-glow);
            border: 1px solid var(--border-glass);
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2rem;
            transition: var(--spring-transition);
        }

        .live-pulse {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--accent);
        }

        .main-title {
            font-weight: 800;
            font-size: 4rem;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .gradient-text {
            background: linear-gradient(110deg, var(--accent) 30%, var(--purple) 50%, var(--accent) 70%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmerEngine 4.5s linear infinite;
        }

        @keyframes textShimmerEngine {
            to { background-position: 200% center; }
        }

        .main-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--interface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;

            overflow: hidden;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.03), 0 4px 24px rgba(0, 0, 0, 0.2);
            padding: 3rem;
            transition: var(--spring-transition);
        }

        .card-glow-tracker {
            position: absolute;
            inset: 0;
            background: radial-gradient(800px circle at var(--mouse-x, 0px) var(--mouse-y, 0px), rgba(255,255,255,0.04), transparent 40%);

            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);

            background: radial-gradient(600px circle at var(--mouse-x, 0px) var(--mouse-y, 0px), rgba(166,43,43,0.03), transparent 40%);

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 2.5rem;
            position: relative;
            z-index: 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent);
            text-transform: uppercase;

            border: 1px solid var(--border-glass);
            padding: 1rem 1.2rem;
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: var(--spring-transition);
            appearance: none;
            -webkit-appearance: none;

            background-position: right 1.2rem center;

            display: none;
            opacity: 0;

            opacity: 1;

            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;

        .output-header h3 {
            font-size: 1.6rem;
            color: var(--text-primary);
        }

        .question-deck {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;

        .question-card {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid var(--accent);
            border-top: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
            border-bottom: 1px solid var(--border-glass);
            border-radius: 0 16px 16px 0;
            padding: 1.8rem;
            transition: var(--spring-transition);
            position: relative;
        }

        [data-theme="light"] .question-card {
            background: rgba(0, 0, 0, 0.01);
        }

        .question-card:hover {
            transform: translateX(6px);
            background: var(--card-hover-bg);
            border-left-color: var(--purple);
        }

        .question-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--purple);
            margin-bottom: 0.6rem;
        }

        .question-text {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Footer Profile Blueprint */
        .premium-footer {
            border-top: 1px solid var(--border-glass);
            padding: 3rem 2rem;
            margin-top: 8rem;
        }

        .footer-inner-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copyright-text a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .copyright-text a:hover {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .control-grid { grid-template-columns: 1fr; gap: 1.2rem; }
            .main-title { font-size: 2.8rem; }
            .glass-card { padding: 2rem; }
            .footer-inner-wrapper { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>

        /* --- THEME CONTROLLER MODULE --- */
        const themeButton = document.getElementById('theme-switcher');
        const themeIcon = themeButton.querySelector('i');
        const themeText = document.getElementById('theme-text');
        const htmlRoot = document.documentElement;

        themeButton.addEventListener('click', () => {
            const systemState = htmlRoot.getAttribute('data-theme');
            if (systemState === 'dark') {
                htmlRoot.setAttribute('data-theme', 'light');
                themeIcon.className = 'fa-solid fa-sun';
                themeText.textContent = 'Light Mode';
            } else {
                htmlRoot.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fa-solid fa-moon';
                themeText.textContent = 'Dark Mode';
            }
            themeButton.blur();
        });

        /* --- IMMERSIVE MOUSE GLOW TRACKER ENGINE --- */
        let ticking = false;
        document.querySelectorAll('.element-interact-node').forEach(card => {
            const tracker = card.querySelector('.card-glow-tracker');
            if (!tracker) return;

            card.addEventListener('mousemove', (event) => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const coordinates = card.getBoundingClientRect();
                        const mouseX = event.clientX - coordinates.left;
                        const mouseY = event.clientY - coordinates.top;
                        
                        tracker.style.setProperty('--mouse-x', `${mouseX}px`);
                        tracker.style.setProperty('--mouse-y', `${mouseY}px`);
                        tracker.style.opacity = '1';
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            card.addEventListener('mouseleave', () => {
                tracker.style.opacity = '0';
            });
        });

        /* --- RANDOMIZED 3-QUESTION SELECTION ENGINE --- */
        const generateBtn = document.getElementById('trigger-engine-btn');
        const gradeSelect = document.getElementById('grade-select');
        const subjectSelect = document.getElementById('subject-select');
        const outputStage = document.getElementById('output-stage');
        const outputTitle = document.getElementById('output-title');
        const renderDeck = document.getElementById('question-render-deck');
        const progressLine = document.getElementById('scroll-progress-line');

        generateBtn.addEventListener('click', () => {
            // Update button label to reflect regeneration capability
            generateBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> Regenerate Random Set';
            
            // Trigger Top Loading Bar Animation Sequence
            progressLine.style.width = '30%';
            
            setTimeout(() => {
                progressLine.style.width = '70%';
            }, 150);

            setTimeout(() => {
                progressLine.style.width = '100%';
                
                const selectedGrade = gradeSelect.value;
                const selectedSubject = subjectSelect.value;
                
                // Clear out existing cards from deck
                renderDeck.innerHTML = '';
                
                // Fetch targeted context node array (Full 50 elements pool)
                const allQuestions = NEB_QUESTION_BANK[selectedGrade][selectedSubject];
                
                // Select 3 random unique questions from the bank
                const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
                const selectedQuestions = shuffled.slice(0, 3);
                
                // Update header values 
                outputTitle.textContent = `NEB Grade ${selectedGrade} • ${selectedSubject.toUpperCase()} Random Set`;

                // Loop through randomized subset and render cards
                selectedQuestions.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'question-card';
                    card.innerHTML = `
                        <div class="question-meta">${item.meta}</div>
                        <div class="question-text">${item.text}</div>
                    `;
                    renderDeck.appendChild(card);
                });

                // Display hidden area with spring animation wrapper
                outputStage.classList.add('reveal');
                
                // Smooth slide view adjustment focus
                outputStage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                // Reset Loading Bar
                setTimeout(() => { progressLine.style.width = '0%'; }, 400);

            }, 400);
        });
    </script>
